<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab15-2</title>

    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .color-cell {
            height: 100px;
            text-align: center;
            vertical-align: middle;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
    </style>
</head>

<body>

<div class="container mt-5">
    <h2 class="text-center mb-4">3 × 3 Color Table</h2>

    <table class="table table-bordered text-center">
        <tr>
            <td class="color-cell" data-color="red">Red</td>
            <td class="color-cell" data-color="blue">Blue</td>
            <td class="color-cell" data-color="green">Green</td>
        </tr>

        <tr>
            <td class="color-cell" data-color="yellow">Yellow</td>
            <td class="color-cell" data-color="orange">Orange</td>
            <td class="color-cell" data-color="purple">Purple</td>
        </tr>

        <tr>
            <td class="color-cell" data-color="pink">Pink</td>
            <td class="color-cell" data-color="brown">Brown</td>
            <td class="color-cell" data-color="cyan">Cyan</td>
        </tr>
    </table>
</div>

<script>
    const cells = document.querySelectorAll(".color-cell");

    cells.forEach(function(cell) {

        // Mouse over
        cell.addEventListener("mouseover", function() {
            cell.style.backgroundColor = cell.getAttribute("data-color");
        });

        // Mouse out
        cell.addEventListener("mouseout", function() {
            cell.style.backgroundColor = "";
        });

    });
</script>

</body>
</html>
