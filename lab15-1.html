
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab15-1</title>

    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            margin-top: 50px;
        }

        img {
            width: 400px;
            height: 250px;
            opacity: 1;
            transition: opacity 0.5s;
        }

     
        img:hover {
            opacity: 0.4;
        }
    </style>
</head>

<body>

    <h2>Image Opacity Effect</h2>

    <p>Move your mouse over the image</p>

    <img src="image 3.jfif" alt="logo">

</body>
