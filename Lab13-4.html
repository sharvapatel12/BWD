<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab13-4</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }

        .pagination {
            display: inline-block;
        }

        .pagination a {
            color: black;
            padding: 10px 16px;
            text-decoration: none;
            border: 1px solid #ddd;
            margin: 2px;
        }

        .pagination a:hover {
            background-color: #ddd;
        }

        .pagination a.active {
            background-color: #007bff;
            color: white;
        }
    </style>
</head>

<body>

    <h1>My Web Page</h1>

    <p>Pagination helps users navigate from one page to another.</p>

    <div class="pagination">
        <a href="#">&laquo; Previous</a>
        <a href="#" class="active">1</a>
        <a href="#">2</a>
        <a href="#">3</a>
        <a href="#">4</a>
        <a href="#">5</a>
        <a href="#">Next &raquo;</a>
    </div>

</body>
</html>
