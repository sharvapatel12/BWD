<!DOCTYPE html>
<html lang="en">
<head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Text Property</title>

            <style>
                  h1{
                        color: rgb(232, 130, 29);
                    }
                 
                  h1 {
                        text-align: center;
                  }
                  a{
                        text-decoration: none;

                  }
                  h1{
                        text-transform: uppercase;
                        text-transform: lowercase;
                  }
                  h1{
                        word-spacing: 30px;
                  }
                  h1{
                        letter-spacing: 10px;
                  }
                  h1{
                      font-family: Arial, Helvetica, sans-serif;   
                  }
                  h1{    
                        font-size: 20px;
                        background-color: aquamarine;
                  }  
                  h2{
                        color: beige;
                        text-align: center;
                        text-decoration: none;
                        text-transform: uppercase;
                        word-spacing: 10px;
                        letter-spacing: 10px;
                        font-size: 10px;
                        background-color: black;
                        font-family: 'Courier New', Courier, monospace;
                  }  
                  h3{
                        color: blue;
                        text-align: left;
                        text-decoration: none;
                        text-transform: uppercase;
                        word-spacing: normal;
                        letter-spacing: 10px;
                        font-size: larger;
                        background-color: burlywood;
                        font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
                  }
                  h4{
                        color: cadetblue;
                        text-align: left;
                        text-decoration: none;
                        text-transform: uppercase;
                        word-spacing: 20px;
                        letter-spacing: 50px;
                        font-size: large;
                        background-color: chocolate;
                        font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif
                  }
                  h5{
                        color: cornflowerblue;
                        text-align: right;
                        text-decoration: none;
                        text-transform: uppercase;
                        word-spacing: normal;
                        letter-spacing: 10px;
                        font-size: large;
                        background-color: brown;
                        font-family: Arial, Helvetica, sans-serif;
                  }
                  h6{
                        color: darkgreen;
                        text-align: right;
                        text-decoration: none;
                        text-transform: uppercase;
                        word-spacing: normal;
                        letter-spacing: 10px;
                        font-size: larger;
                        background-color: darkgray;
                        font-family: 'Times New Roman', Times, serif;
                  }
            </style>
</head>
<body>
            <h1>Hello World</h1>
            <h2>Hello World</h2>
            <h3>Hello World</h3>
            <h4>Hello World</h4>
            <h5>Hello World</h5>
            <h6>Hello World</h6>
</body>
</html>
