<!DOCTYPE html>
<html lang="en">
<head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Lab 9-3</title>
            <style>
                       
                                    .circle{
                                                height: 30px;
                                                width: 30px;
                                                background-color: black;
                                                border: 1px solid red;
                                                border-radius: 50%;


                                    }

                                    .rectangle{
                                                height: 30px;
                                                width: 50px;
                                                background-color: aquamarine;
                                                border: 1px solid saddlebrown;
                                                border-radius: 1px;


                                    }
                                    
                                    .square{
                                                height: 30px;
                                                width: 30px;
                                                background-color: blue;
                                                border: 1px solid darkgray;
                                                border-radius: 1px;
                                    }
                                    
                                    .oval{
                                                height: 100px;
                                                width: 70px;
                                                background-color: cadetblue;
                                                border: 1px solid plum;
                                                border-radius: 50%;
                                    }

                                    .triangle{
                                                height: 0;
                                                width: 0;
                                                border-left: 60px solid transparent;
                                                border-right: 60px solid transparent;
                                                border-bottom: 60px solid aqua;
                                                margin: 10px;

                                    }

                       
            </style>
</head>
<body>
            <h1 align="center">Different Shapes</h1>
     <div class="circle"></div><br><br>
     <div class="rectangle"></div><br><br>
     <div class="square"></div><br><br>   
     <div class="oval"></div><br><br>
     <div class="triangle"></div>  
    
</body>
</html>
