<!DOCTYPE html>
<html>
<head>
    <title>lab10-1</title>

    <style>
        .slider {
            width: 600px;
            height: 350px;
            position: relative;
            margin: 50px auto;
            overflow: hidden;
        }

        .slide {
            width: 600px;
            height: 350px;
            position: absolute;
            top: 0;
            left: 0;
        }

        .slide img {
            width: 100%;
            height: 100%;
        }

        .slide1 {
            z-index: 1;
        }

        .slide2 {
            z-index: 2;
        }

        .slide3 {
            z-index: 3;
        }

        .text {
            position: absolute;
            z-index: 10;
            top: 130px;
            left: 150px;
            color: white;
            font-size: 35px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h2 align="center">Image Slider with Text</h2>

    <div class="slider">

        <div class="slide slide1">
            <img src="img for css.jpg">
        </div>

        <div class=" slide slide2">
            <img src="image 4.jpg">
        </div>

        <div class=" slide slide3">
            <img src="img for css.jpg">
        </div>

        <div class="text">
            Welcome to My Website
        </div>

    </div>

</body>
</html>
