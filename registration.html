<!DOCTYPE html>
<html lang="en">
<head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Registration form</title>
</head>
<body>
           <form>
            Name : <input type="text" name="name" placeholder="Enter name"/> <br><br>
            Password : <input type="password" name="password"  placeholder="Enter password"/> <br><br>
            Confirm Password : <input type="confirm password" name="confirm password"  placeholder="Enter confirm password"/> <br><br>
            Phone : <input type="number" name="number" placeholder="Enter phone number"/> <br><br>
            Email : <input type="email" name="email" placeholder="Enter email" /> <br><br>
            Address : <textarea rows="5" cols="20" placeholder="Enter address"></textarea><br><br>



           </form> 
</body>
</html>
